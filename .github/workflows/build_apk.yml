name: Build SajdahLock APK

on:
push:
branches: [ "main", "master" ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 15

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'
      cache: 'gradle'

  - name: Generate Gradle Wrapper
    run: |
      # Use standard gradle wrapper creation without external network hooks
      mvn -version 2>/dev/null || true
      gradle wrapper --gradle-version 8.5 || gradle wrapper

  - name: Make Gradlew Executable
    run: chmod +x gradlew

  - name: Build APK (with automatic retry on network lag)
    run: |
      # The options prevent 504 gateway drops by increasing network timeout & retries
      ./gradlew assembleDebug \
        --stacktrace \
        --no-daemon \
        -Dorg.gradle.internal.http.socketTimeout=60000 \
        -Dorg.gradle.internal.http.connectionTimeout=60000

  - name: Upload Debug APK
    uses: actions/upload-artifact@v4
    if: success()
    with:
      name: SajdahLock-APK
      path: app/build/outputs/apk/debug/*.apk
      retention-days: 7
